<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F3D57"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#062330" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- chat bubble -->
  <g filter="url(#shadow)">
    <path d="M232 250 h520 a70 70 0 0 1 70 70 v300 a70 70 0 0 1 -70 70 h-330 l-120 100 v-100 h-70 a70 70 0 0 1 -70 -70 v-300 a70 70 0 0 1 70 -70 z" fill="#FFFFFF"/>
  </g>
  <!-- delivery box -->
  <g fill="none" stroke="#0F3D57" stroke-width="30" stroke-linejoin="round" stroke-linecap="round">
    <path d="M492 340 L640 400 L492 460 L344 400 Z" fill="#CCFBF1"/>
    <path d="M344 400 V560 L492 620 V460" fill="#99F6E4"/>
    <path d="M640 400 V560 L492 620 V460 Z" fill="#5EEAD4"/>
    <path d="M418 370 L566 430 V480" stroke-width="24"/>
  </g>
  <!-- verified seal -->
  <g filter="url(#shadow)">
    <circle cx="742" cy="676" r="128" fill="url(#seal)" stroke="#FFFFFF" stroke-width="22"/>
  </g>
  <path d="M686 678 l38 38 l78 -82" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
